# Cloudflare Pages configuration for Gifted Grads Events.
#
# Usage:
#   - Local dev:        npx wrangler pages dev -- npm run dev
#   - Apply migrations: npx wrangler d1 migrations apply DB --local   (local)
#                       npx wrangler d1 migrations apply DB --remote  (production)
#   - Set secrets:      npx wrangler pages secret put RESEND_API_KEY
#   - Create an admin:  npm run bootstrap:admin -- --email you@example.com --name "You"
#
# Administrative access uses individual accounts in `admin_users`; the old
# shared MANAGER_PASSWORD secret is no longer read by any code.
#
# The `DB` D1 binding and the `RESEND_FROM` / `ORGANIZER_EMAIL` plain vars
# can also be configured from the Cloudflare dashboard; this file is the
# source of truth for local development via `wrangler pages dev`.

name = "takethel33d"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Plain vars (NOT secrets — these are committed)
[vars]
RESEND_FROM = "Gifted Grads <noreply@aainsurances.com>"
ORGANIZER_EMAIL = "info@aainsurances.com"

# D1 binding — PRODUCTION.
#
# This is the live database. It carries real participants, real draws and real
# published results, and every guarantee the application makes about them is
# only as good as the promise that nothing else writes here.
[[d1_databases]]
binding = "DB"
database_name = "taketheleed"
database_id = "fe66fac1-30a0-4910-8bc3-55388e9b8b63"
migrations_dir = "migrations"

# D1 binding — PREVIEW.
#
# WHY THIS EXISTS. Pages builds a preview deployment for every non-production
# branch and pull request, and a Pages preview inherits the top-level bindings
# unless an environment overrides them. Without this block, opening a pull
# request would give that branch's code a live handle on the production
# database — and a preview is, by definition, code nobody has reviewed yet.
#
# A SEPARATE DATABASE, not a read-only view of the same one: the point is that a
# preview may write, and that its writes must land somewhere disposable. It is
# dedicated to this project and to this purpose, and is never the production
# database under another name.
#
# It starts empty. Apply the schema to it the same way as production when a
# preview needs one:
#   npx wrangler d1 migrations apply taketheleed-preview --remote
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "taketheleed-preview"
database_id = "38632ce1-1eab-4048-990f-2acb2f7cb8fd"
migrations_dir = "migrations"
